<!DOCTYPE html>
<html lang="zh-CN">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Claude Code Chat</title>

  <link rel="stylesheet" href="./index.css">
  <script src="./highlight.min.js"></script>

  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
      max-width: 900px;
      margin: 0 auto;
      padding: 20px;
      background-color: #fafafa;
    }

    /* 聊天容器 - 可滚动 */
    #chatContainer {
      height: 60vh;
      overflow-y: auto;
      border: 1px solid #ddd;
      border-radius: 8px;
      padding: 16px;
      background: #fff;
      margin-bottom: 16px;
    }

    /* 单条消息 */
    .msg {
      margin-bottom: 16px;
      line-height: 1.6;
    }
    .msg-user {
      color: #222;
    }
    .msg-ai {
      color: #333;
      padding-left: 8px;
      border-left: 3px solid #28a745;
    }

    #chatContainer pre {
      background: #f6f8fa;
      border: 1px solid #e1e4e8;
      border-radius: 6px;
      padding: 16px;
      margin: 16px 0;
      overflow-x: auto;
    }

    #chatContainer code {
      font-family: 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace;
      font-size: 13px;
    }

    .input-area {
      display: flex;
      gap: 8px;
      align-items: center;
    }

    #question {
      flex: 1;
      padding: 10px;
      font-size: 14px;
      border: 1px solid #ccc;
      border-radius: 4px;
    }

    button {
      padding: 10px 20px;
      background: #28a745;
      color: white;
      border: none;
      border-radius: 4px;
      cursor: pointer;
    }

    button:hover {
      background: #218838;
    }
  </style>
</head>

<body>
  <!-- 聊天列表容器 -->
  <div id="chatContainer"></div>

  <div class="input-area">
    <input id="question" placeholder="请输入你的问题" autofocus>
    <button onclick="sendMessage()">发送提问</button>
  </div>

  <script>
    // 固定会话ID
    if (!localStorage.getItem('sessionId')) {
      const sid = Math.random().toString(36).substring(2, 10);
      localStorage.setItem('sessionId', sid);
    }
    const sessionId = localStorage.getItem('sessionId');

    let abortController = null;
    let currentAiDom = null;

    // 添加一条消息到聊天面板
    function appendMsg(role, html = '') {
      const container = document.getElementById('chatContainer');
      const div = document.createElement('div');
      div.className = role === 'user' ? 'msg msg-user' : 'msg msg-ai';
      div.innerHTML = html;
      container.appendChild(div);
      // 滚动到底部
      container.scrollTop = container.scrollHeight;
      return div;
    }

    async function sendMessage() {
      const questionInput = document.getElementById('question');
      const question = questionInput.value.trim();
      if (!question) {
        alert("请输入问题");
        return;
      }

      // 1. 先添加用户提问
      appendMsg('user', `<strong>你：</strong>${escapeHtml(question)}`);
      // 清空输入框
      questionInput.value = '';

      // 2. 创建AI回复占位
      currentAiDom = appendMsg('ai', `<strong>AI：</strong><span id="ai-content"></span>`);

      if (abortController) abortController.abort();
      abortController = new AbortController();

      try {
        const response = await fetch('http://localhost:3000/api/chat/stream', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            question: question,
            sessionId: sessionId
          }),
          signal: abortController.signal
        });

        if (!response.ok) throw new Error(`HTTP ${response.status}`);

        const reader = response.body.getReader();
        const decoder = new TextDecoder('utf-8');
        let buffer = '';
        let fullContent = '';

        while (true) {
          const { done, value } = await reader.read();
          if (done) break;

          buffer += decoder.decode(value, { stream: true });
          const lines = buffer.split('\n\n');
          buffer = lines.pop() || '';

          for (const line of lines) {
            if (!line.trim() || line === 'data: [DONE]') continue;
            if (line.startsWith('data:')) {
              try {
                const jsonStr = line.substring(5).trim();
                const payload = JSON.parse(jsonStr);

                if (payload.content !== undefined) {
                  fullContent += payload.content;
                  // 实时渲染markdown+代码高亮
                  const renderHtml = renderMarkdownWithCodeHighlightRaw(fullContent);
                  currentAiDom.querySelector('#ai-content').innerHTML = renderHtml;
                }
                if (payload.error) {
                  currentAiDom.querySelector('#ai-content').innerText = '请求异常：' + payload.error;
                  return;
                }
              } catch (e) {
                console.warn('解析失败', line);
              }
            }
          }
        }
      } catch (error) {
        if (error.name !== 'AbortError') {
          currentAiDom.querySelector('#ai-content').innerText = '请求异常：' + error.message;
        }
      }
    }

    function escapeHtml(text) {
      return text.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
    }

    // 纯渲染，不操作外部DOM
    function renderMarkdownWithCodeHighlightRaw(markdownText) {
      let escaped = escapeHtml(markdownText);
      const codeBlocks = [];
      escaped = escaped.replace(/```(\w*)\n([\s\S]*?)\n```/g, (match, lang, code) => {
        codeBlocks.push({ lang, code });
        return `{{CODE_${codeBlocks.length - 1}}}`;
      });

      let result = escaped.replace(/\n/g, '<br>');
      result = result.replace(/\{\{CODE_(\d+)\}\}/g, (match, index) => {
        const { lang, code } = codeBlocks[index];
        const langAttr = lang ? `class="language-${lang}"` : '';
        return `<pre><code ${langAttr}>${code}</code></pre>`;
      });
      return result;
    }

    // 回车发送
    document.getElementById('question').addEventListener('keypress', (e) => {
      if (e.key === 'Enter') sendMessage();
    });
  </script>
</body>

</html>
